<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="424" viewBox="0 0 1200 424" role="img" aria-labelledby="t d">
  <title id="t">Bladecall 剑令 — a calm inbox for AI work</title>
  <desc id="d">Bladecall watches local AI coding tools and brings finished results back to one quiet macOS inbox. You stay in command; AI does the work.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D9CBAA" stroke-width="1" opacity="0.32"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="422" rx="24" fill="#F7ECD1" stroke="#211914" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="422" rx="24" fill="url(#grid)"/>

  <!-- brand column -->
  <g transform="translate(56 52)">
    <g transform="scale(2.5)">
      <path fill="#211914" d="M8 2h16v2h4v4h2v16h-2v4h-4v2H8v-2H4v-4H2V8h2V4h4V2Z"/>
      <path fill="#A6282A" d="M8 4h16v2h2v2h2v16h-2v2h-2v2H8v-2H6v-2H4V8h2V6h2V4Z"/>
      <path fill="#C63A37" d="M8 4h16v2h2v2H8V6H6V4h2Z"/>
      <path fill="#FFF8E8" d="m16 6 6 8h-2v4h-2v2h-4v-2h-2v-4h-2l6-8Z"/>
      <path fill="#E2AD62" d="M8 18h6v2h4v-2h6v4h-6v4h-4v-4H8v-4Z"/>
      <path fill="#FFF8E8" d="M14 26h4v2h-4v-2Z"/>
    </g>
    <text x="0" y="120" fill="#9D282B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2.4">LOCAL-FIRST · MACOS MENU BAR APP</text>
    <text x="0" y="188" fill="#211914" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="66" font-weight="800" letter-spacing="-1">Bladecall</text>
    <text x="322" y="188" fill="#9D282B" font-family="Songti SC, STSong, serif" font-size="46">剑令</text>
    <text x="0" y="232" fill="#4B3B31" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="640">A calm inbox for AI work.</text>
    <text x="0" y="268" fill="#6C584A" font-family="Songti SC, STSong, serif" font-size="22" letter-spacing="1">人掌令，AI 行剑。</text>
    <g transform="translate(0 296)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">
      <rect width="182" height="38" rx="5" fill="#211914"/>
      <text x="91" y="25" text-anchor="middle" fill="#FFF8E8">QUIET BY DEFAULT</text>
      <rect x="194" width="128" height="38" rx="5" fill="#EFDFBC" stroke="#AA987C"/>
      <text x="258" y="25" text-anchor="middle" fill="#4B3B31">LOCAL DATA</text>
      <rect x="334" width="112" height="38" rx="5" fill="#EFDFBC" stroke="#AA987C"/>
      <text x="390" y="25" text-anchor="middle" fill="#4B3B31">EN / 中文</text>
    </g>
  </g>

  <!-- result route panel -->
  <g transform="translate(694 40)">
    <rect width="454" height="344" rx="16" fill="#211914"/>
    <rect x="14" y="14" width="426" height="316" rx="10" fill="#FFF8E8"/>
    <g transform="translate(34 30)">
      <text x="0" y="20" fill="#9D282B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800" letter-spacing="1.5">RESULT ROUTE</text>
      <circle cx="308" cy="15" r="5" fill="#299963"/>
      <text x="388" y="20" text-anchor="end" fill="#299963" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">MONITORING</text>
    </g>
    <!-- runtimes -->
    <g transform="translate(34 74)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#33261E">
      <circle cx="13" cy="14" r="13" fill="#4E55F3"/><text x="34" y="19">CODEX</text>
      <circle cx="151" cy="14" r="13" fill="#D9704E"/><text x="172" y="19">CLAUDE</text>
      <circle cx="300" cy="14" r="13" fill="#956FBE"/><text x="321" y="19">CRAFT</text>
    </g>
    <!-- rows -->
    <g transform="translate(34 122)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      <rect width="372" height="46" rx="9" fill="#F1E7CF"/>
      <text x="16" y="28" fill="#33261E" font-size="16" font-weight="600">Fix login timeout · Craft</text>
      <rect x="286" y="12" width="72" height="22" rx="11" fill="#3979DA22"/>
      <text x="322" y="27" text-anchor="middle" fill="#3979DA" font-family="ui-monospace, monospace" font-size="12" font-weight="700">READY</text>
    </g>
    <g transform="translate(34 178)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      <rect width="372" height="46" rx="9" fill="#F1E7CF"/>
      <text x="16" y="28" fill="#33261E" font-size="16" font-weight="600">Data migration script · Codex</text>
      <rect x="270" y="12" width="88" height="22" rx="11" fill="#DF8A2622"/>
      <text x="314" y="27" text-anchor="middle" fill="#B96F14" font-family="ui-monospace, monospace" font-size="12" font-weight="700">RUNNING</text>
    </g>
    <g transform="translate(34 234)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" opacity="0.62">
      <rect width="372" height="46" rx="9" fill="#F1E7CF"/>
      <text x="16" y="28" fill="#33261E" font-size="16" font-weight="600">Routine runs ▸ 12</text>
      <rect x="286" y="12" width="72" height="22" rx="11" fill="#29996322"/>
      <text x="322" y="27" text-anchor="middle" fill="#299963" font-family="ui-monospace, monospace" font-size="12" font-weight="700">DONE</text>
    </g>
  </g>
</svg>
